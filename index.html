/* ============================================================================
   19. SCHEDULING ENGINE (Glamsquad/Urban model)
   Scheduled In-Room booking is the primary flow; ASAP stays as the hybrid edge.
   Availability is deterministic per provider+day+time so the demo is stable.
   ========================================================================== */
S.day=0; S.win='any'; S.slot=null; S.phone=''; S.tos=false;
const WINS=[['any','wAny',[8,23]],['morning','wMorning',[8,12]],['noon','wNoon',[12,16]],
            ['evening','wEvening',[16,20]],['night','wNight',[20,23]]];
function hash32(s){let x=2166136261;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619);}return (x>>>0);}
function dayDate(off){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+off);return d;}
function dayLabel(off){
  if(off===0)return t('today');
  if(off===1)return t('tomorrow');
  return dayDate(off).toLocaleDateString(STR[S.lang].locale,{weekday:'short'});
}
function daySub(off){return dayDate(off).toLocaleDateString(STR[S.lang].locale,{day:'numeric',month:'numeric'});}
function winRange(w){const x=WINS.find(v=>v[0]===w);return x?x[2]:[8,23];}
function allSlots(off,win){
  const [a,b]=winRange(win),out=[],now=new Date();
  for(let hh=a;hh<b;hh++)for(const mm of [0,30]){
    if(off===0){const d=dayDate(0);d.setHours(hh,mm,0,0);if(d.getTime()<now.getTime()+60*60000)continue;}
    out.push(String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'));
  }
  return out;
}
function slotOpen(p,off,hhmm){return hash32(p.id+'|'+off+'|'+hhmm)%10>2;}
function daySlots(p,off,win){return allSlots(off,win).filter(s=>slotOpen(p,off,s));}
function earliestSlot(p,off){const s=daySlots(p,off,'any');return s.length?s[0]:null;}
function slotCount(p,off){return daySlots(p,off,'any').length;}
function isAsap(){return S.day===-1;}
function apptDate(){
  if(isAsap())return new Date(Date.now()+45*60000);
  const d=dayDate(S.day),parts=String(S.slot||'12:00').split(':');
  d.setHours(+parts[0],+parts[1],0,0);return d;
}
function apptLabel(){
  if(isAsap())return t('asapChip')+' · '+t('asapSub');
  const d=apptDate();
  return dayLabel(S.day)+' '+daySub(S.day)+' · '+d.toLocaleTimeString(STR[S.lang].locale,{hour:'2-digit',minute:'2-digit'});
}
function apptFar(){return !isAsap()&&(apptDate().getTime()-Date.now())>2*3600000;}
function countdown(){
  const ms=Math.max(0,apptDate().getTime()-Date.now());
  return {d:Math.floor(ms/86400000),h:Math.floor(ms/3600000)%24,m:Math.floor(ms/60000)%60};
}
function whenPicker(){
  const days=[-1,0,1,2,3,4,5,6];
  return '<div class="shead"><h3>'+esc(t('whenTitle'))+'</h3><span>'+esc(apptLabel())+'</span></div>'+
    '<div class="daystrip">'+days.map(o=>o===-1
      ? '<button class="day asap '+(S.day===-1?'on':'')+'" data-a="day" data-v="-1"><b>'+esc(t('asapChip'))+'</b><span>'+esc(t('asapSub'))+'</span></button>'
      : '<button class="day '+(S.day===o?'on':'')+'" data-a="day" data-v="'+o+'"><b>'+esc(dayLabel(o))+'</b><span>'+esc(daySub(o))+'</span></button>'
    ).join('')+'</div>'+
    (isAsap()?'':'<div class="wins">'+WINS.slice(1).map(w=>
      '<button class="win '+(S.win===w[0]?'on':'')+'" data-a="win" data-v="'+w[0]+'"><b>'+esc(t(w[1]))+'</b>'+
      '<span>'+w[2][0]+'–'+w[2][1]+'</span></button>').join('')+'</div>');
}

    '<div class="slist">'+rows.map(r=>'<div class="sitem">'+ic(r[2])+'<div><b>'+esc(r[0])+'</b><p>'+esc(r[1])+'</p></div></div>').join('')+'</div>'+
    '<span class="lbl">'+esc(t('secProxy'))+'</span>'+
    '<div class="cfgfield">'+ic('link')+'<input type="text" data-k="__api" value="'+esc(CFG.apiBase)+
      '" placeholder="'+esc(t('secProxyPh'))+'" aria-label="'+esc(t('secProxy'))+'"></div>'+
    '<p class="tiny">'+ic('info','ii')+' '+esc(he?'כשמוגדרת כתובת Backend, הקליטה מהרשתות החברתיות עוברת דרכה והטוקן לא נוגע בדפדפן.'
      :'With a backend URL set, social ingestion goes through it and the token never touches the browser.')+'</p>'+
    '<button class="cta ghost" style="margin-top:14px" data-a="closesheet">'+esc(t('cancel'))+'</button>';
}

    ['GoWabi · ClassPass','אינדקס יבש של מכונים. ההיצע נבנה ידנית, איטי ויקר.','גיוס אוטומטי מ־Google Places ב־30 שניות, גלריה נשאבת מאינסטגרם, מעקב חי ביום התור.'],
    ['הזמנה ישירה בוואטסאפ','זול ומיידי, אבל אפס אמון: אין אימות, אין ביטוח, אין סליקה.','FRESH-Shield: בדיקת רקע, PIN, ערכה סטרילית, ביטוח וסליקה מאובטחת.'],

/* ---------- 12. RENDER + BOOT ---------- */
function render(){
  const root=document.getElementById('root');
  const ae=document.activeElement;
  const keep=ae&&ae.dataset&&ae.dataset.k?{k:ae.dataset.k,pos:ae.selectionStart}:null;
  root.innerHTML=shell();
  if(keep){
    const el=root.querySelector('[data-k="'+keep.k+'"]');
    if(el){el.focus();try{el.setSelectionRange(keep.pos,keep.pos);}catch(e){}}
  }
  hydrateIcons();
  if(S.screen==='track')mountMap();
}
document.addEventListener('click',onClick);
document.addEventListener('input',onInput);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.sheet){S.sheet=null;render();}
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.getAttribute&&e.target.getAttribute('role')==='button'){
    e.preventDefault();onClick({target:e.target,preventDefault:()=>{}});
  }
});
setInterval(()=>{
  if(S.sheet==='pin')return;
  if(S.screen==='pro'){
    REQS.forEach(r=>{r.left=Math.max(0,r.left-1);
      const el=document.querySelector('[data-timer="'+r.id+'"]');if(el)el.textContent=fmtTime(r.left);});
  }
  scrapTick();
  if(S.screen==='matching')matchTick();
  if(S.screen==='track'&&S.bookState==='enroute')trackTick();
  if(S.screen==='home'&&Math.random()<0.07){
    S.scrapedToday++;
    const el=document.querySelector('.ticker-txt');
    if(el)el.innerHTML='<b>'+esc(t('tickerA'))+'</b> · '+S.scrapedToday+' '+esc(t('tickerB'))+
      '<span style="display:block;color:var(--mute);font-size:11px;margin-top:2px">Instagram · TikTok · Facebook · Google Places</span>';
  }
},1000);
setInterval(obTick,250);
setLang('he');
/* Boot: ask our own backend first. Every failure is caught inside, the badge
   flips to OFFLINE and the app keeps running on local data. */
checkBackendConnection();
</script>
