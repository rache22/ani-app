<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14100E">
<title>ANI — Beauty & Care Tailored to Me</title>

<!-- Typography: Frank Ruhl Libre (Hebrew serif, display) + Heebo (bilingual grotesk, UI) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<!-- Tailwind CSS (Play CDN), mapped to the ANI token system -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  window.tailwind = window.tailwind || {};
  tailwind.config = { theme: { extend: {
    colors:{ ink:'#14100E', ink2:'#1B1614', surf:'#221C19', pearl:'#F4EDE4',
             dim:'#B5A79B', lacquer:'#FF4D6D', bulb:'#FFC773', jade:'#4ADE9B' },
    fontFamily:{ display:['Frank Ruhl Libre','serif'], ui:['Heebo','sans-serif'] },
    borderRadius:{ ani:'22px' }
  } } };
</script>

<!-- Lucide icon set. Every icon has an inline fallback, so a blocked CDN never blanks the UI. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.294.0/lucide.min.js"></script>

<!-- Leaflet: live map for the tracker. Graceful fallback map is built in. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>
/* ============================================================
   ANI DESIGN SYSTEM
   Direction: "hotel room at night" — warm espresso dark, nail
   lacquer rose, vanity-bulb amber. Signature: the Arrival Ring.
   ============================================================ */
:root{
  --ink:#14100E; --ink-2:#1B1614; --surf:#221C19; --surf-2:#2C2421; --surf-3:#372D28;
  --line:rgba(244,237,228,.10); --line-2:rgba(244,237,228,.20);
  --pearl:#F4EDE4; --dim:#B5A79B; --mute:#867569;
  --lacquer:#FF4D6D; --lacquer-deep:#C92B4C; --lacquer-soft:rgba(255,77,109,.14);
  --bulb:#FFC773; --bulb-soft:rgba(255,199,115,.14);
  --jade:#4ADE9B; --jade-soft:rgba(74,222,155,.13);
  --r-s:10px; --r-m:16px; --r-l:22px; --r-xl:30px;
  --ff-display:'Frank Ruhl Libre','Georgia',serif;
  --ff-ui:'Heebo','Assistant','Segoe UI',system-ui,-apple-system,sans-serif;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 10px 30px -12px rgba(0,0,0,.7);
  --sh-glow:0 0 0 1px rgba(255,199,115,.25), 0 8px 30px -8px rgba(255,199,115,.35);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--ink); color:var(--pearl);
  font-family:var(--ff-ui); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
ul,ol{margin:0;padding:0;list-style:none}
h1,h2,h3,h4,p{margin:0}
img,svg{display:block;max-width:100%}
svg{width:18px;height:18px;flex:0 0 auto}
.ii{display:inline-block;width:14px;height:14px;vertical-align:-2px;flex:none}
.tag svg{display:inline-block;width:11px;height:11px;vertical-align:-1px}
.sos svg{display:inline-block;width:13px;height:13px;vertical-align:-2px}
.ticker>svg{color:var(--bulb);opacity:.55}
input{-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--bulb);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:0;height:0}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- STAGE (desktop: device + pitch rail) ---------- */
.stage{min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:14px;
  padding:14px clamp(14px,3vw,30px);border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--ink-2),var(--ink));position:sticky;top:0;z-index:60;
}
.wordmark{display:flex;align-items:baseline;gap:8px}
.wordmark b{
  font-family:var(--ff-display);font-weight:900;font-size:25px;letter-spacing:.02em;
  line-height:1;position:relative;
}
.wordmark b::after{
  content:"";position:absolute;inset-inline:0;bottom:-5px;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--lacquer),var(--bulb));
}
.wordmark span{font-size:10.5px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase}
[dir=rtl] .wordmark span{letter-spacing:.05em}
.topbar-sp{flex:1}
.tbtn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;
  border:1px solid var(--line-2);color:var(--dim);font-size:12.5px;font-weight:500;
  transition:.18s;white-space:nowrap;
}
.tbtn:hover{color:var(--pearl);border-color:var(--bulb);background:var(--bulb-soft)}
.tbtn.on{color:var(--ink);background:var(--bulb);border-color:var(--bulb);font-weight:700}
.tbtn svg{width:15px;height:15px}

.stage-body{flex:1;display:flex;gap:clamp(16px,3vw,44px);padding:clamp(14px,3vw,34px);
  align-items:flex-start;justify-content:center;max-width:1360px;margin:0 auto;width:100%}

/* device shell */
.device{
  width:414px;flex:0 0 414px;height:844px;max-height:calc(100dvh - 130px);
  background:var(--ink-2);border-radius:44px;border:1px solid var(--line-2);
  box-shadow:var(--sh-2),0 0 90px -30px rgba(255,199,115,.22);
  padding:11px;position:relative;
}
.screenwrap{
  position:relative;height:100%;border-radius:34px;overflow:hidden;
  background:radial-gradient(120% 55% at 50% 0%,#241D19 0%,var(--ink) 62%);
  display:flex;flex-direction:column;
}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:112px;height:26px;
  border-radius:999px;background:#0A0806;z-index:40}

/* pitch rail */
.rail{flex:1;min-width:0;max-width:520px;padding-top:6px;position:sticky;top:96px}
.rail-eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--lacquer);font-weight:700}
[dir=rtl] .rail-eyebrow{letter-spacing:.06em}
.rail-num{font-family:var(--ff-display);font-weight:900;font-size:clamp(48px,7vw,76px);line-height:.95;margin:14px 0 6px;letter-spacing:-.01em}
.rail-num em{font-style:normal;color:var(--bulb)}
.rail-claim{font-size:19px;font-weight:300;color:var(--dim);line-height:1.45;max-width:44ch}
.rail-mech{margin-top:22px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r-m);
  background:linear-gradient(180deg,var(--surf),transparent);display:flex;gap:12px;align-items:flex-start}
.rail-mech svg{width:19px;height:19px;color:var(--bulb);flex:0 0 auto;margin-top:2px}
.rail-mech b{display:block;font-size:13.5px;font-weight:700;margin-bottom:3px}
.rail-mech p{font-size:13px;color:var(--mute);line-height:1.5}
.rail-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.rail-chip{border:1px solid var(--line);border-radius:var(--r-m);padding:13px 14px;background:var(--ink-2)}
.rail-chip b{display:block;font-size:22px;font-weight:900;letter-spacing:-.02em}
.rail-chip span{font-size:11px;color:var(--mute);line-height:1.35;display:block;margin-top:3px}
.rail-foot{margin-top:20px;font-size:11.5px;color:var(--mute);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rail-foot b{color:var(--dim);font-weight:500}

/* ---------- APP CHROME (inside device) ---------- */
.appbar{padding:16px 18px 10px;display:flex;align-items:center;gap:10px;flex:0 0 auto;position:relative;z-index:20}
.appbar .back{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);
  display:grid;place-items:center;color:var(--dim);transition:.18s}
.appbar .back:hover{color:var(--pearl);border-color:var(--pearl)}
.appbar .back svg{width:17px;height:17px}
[dir=rtl] .appbar .back svg{transform:scaleX(-1)}
.appbar h2{font-family:var(--ff-display);font-size:19px;font-weight:700;flex:1;letter-spacing:.01em}
.appbar .sub{font-size:11.5px;color:var(--mute);font-weight:400;font-family:var(--ff-ui);display:block;margin-top:1px}

/* progress spine: 5 bulbs = 5 steps of the real booking sequence */
.spine{display:flex;gap:5px;padding:0 18px 10px;flex:0 0 auto}
.spine i{height:3px;flex:1;border-radius:3px;background:rgba(244,237,228,.11);transition:.35s}
.spine i.done{background:rgba(255,199,115,.4)}
.spine i.now{background:var(--bulb);box-shadow:0 0 10px rgba(255,199,115,.7)}

.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 18px 30px;scroll-behavior:smooth}
.scroll.flush{padding:0}

/* ---------- HERO (home) ---------- */
.hero{position:relative;padding:6px 0 20px}
.bulbrail{display:flex;gap:9px;justify-content:center;margin-bottom:22px}
.bulbrail i{width:7px;height:7px;border-radius:50%;background:var(--bulb);opacity:.25;
  animation:bulb 3.4s infinite ease-in-out}
.bulbrail i:nth-child(2){animation-delay:.25s}.bulbrail i:nth-child(3){animation-delay:.5s}
.bulbrail i:nth-child(4){animation-delay:.75s}.bulbrail i:nth-child(5){animation-delay:1s}
.bulbrail i:nth-child(6){animation-delay:1.25s}.bulbrail i:nth-child(7){animation-delay:1.5s}
@keyframes bulb{0%,100%{opacity:.22;box-shadow:none}50%{opacity:1;box-shadow:0 0 14px 2px rgba(255,199,115,.6)}}
.hero h1{font-family:var(--ff-display);font-weight:900;font-size:34px;line-height:1.1;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--bulb)}
.hero p{color:var(--dim);font-size:14px;margin-top:10px;font-weight:300;line-height:1.5}

/* mode switch: in-room vs walk-in */
.modeswitch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0 14px}
.mode{
  border:1px solid var(--line-2);border-radius:var(--r-l);padding:15px 14px;text-align:start;
  background:var(--ink-2);transition:.2s;position:relative;overflow:hidden;
}
.mode svg{width:22px;height:22px;color:var(--dim);margin-bottom:9px;transition:.2s}
.mode b{display:block;font-size:14.5px;font-weight:700}
.mode span{display:block;font-size:11.5px;color:var(--mute);margin-top:3px;line-height:1.35}
.mode.on{border-color:var(--lacquer);background:linear-gradient(160deg,var(--lacquer-soft),transparent 70%)}
.mode.on svg{color:var(--lacquer)}
.mode:hover{border-color:var(--line-2);transform:translateY(-1px)}

/* search + geo */
.searchrow{display:flex;gap:9px;margin-bottom:8px}
.field{
  flex:1;display:flex;align-items:center;gap:9px;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r-m);padding:0 13px;height:48px;transition:.18s;
}
.field:focus-within{border-color:var(--bulb)}
.field svg{width:17px;height:17px;color:var(--mute);flex:0 0 auto}
.field input{flex:1;background:none;border:0;outline:0;font-size:14px;min-width:0}
.field input::placeholder{color:var(--mute)}
.geobtn{width:48px;height:48px;border-radius:var(--r-m);background:var(--bulb);color:var(--ink);
  display:grid;place-items:center;flex:0 0 auto;transition:.2s}
.geobtn:hover{filter:brightness(1.08)}
.geobtn svg{width:19px;height:19px}
.geobtn.busy{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.geoline{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px;margin-bottom:18px}
.geoline svg{width:13px;height:13px;color:var(--jade)}

/* section head */
.shead{display:flex;align-items:baseline;gap:10px;margin:22px 0 12px}
.shead h3{font-size:14px;font-weight:700;letter-spacing:.01em}
.shead span{font-size:11.5px;color:var(--mute);margin-inline-start:auto}

/* category grid */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.cat{border:1px solid var(--line);background:var(--ink-2);border-radius:var(--r-m);padding:14px 10px;
  text-align:center;transition:.2s}
.cat:hover,.cat.on{border-color:var(--bulb);background:var(--bulb-soft);transform:translateY(-2px)}
.cat svg{width:21px;height:21px;margin:0 auto 8px;color:var(--bulb)}
.cat b{font-size:12px;font-weight:500;display:block}
.cat span{font-size:10.5px;color:var(--mute);display:block;margin-top:2px}

/* scraper ticker */
.ticker{border:1px solid var(--line);border-radius:var(--r-m);background:var(--ink-2);padding:12px 14px;
  display:flex;gap:11px;align-items:center;margin-top:18px;overflow:hidden}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--jade);flex:0 0 auto;position:relative}
.pulse::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid var(--jade);
  animation:ping 1.8s infinite}
@keyframes ping{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.5);opacity:0}}
.ticker-txt{flex:1;min-width:0;font-size:12.5px;color:var(--dim);line-height:1.35}
.ticker-txt b{color:var(--pearl);font-weight:700}

/* trust strip */
.trust{margin-top:18px;border:1px solid rgba(74,222,155,.28);border-radius:var(--r-l);
  background:linear-gradient(160deg,var(--jade-soft),transparent 65%);padding:16px}
.trust-h{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.trust-h svg{width:18px;height:18px;color:var(--jade)}
.trust-h b{font-size:14px;font-weight:700}
.trust p{font-size:12.5px;color:var(--dim);line-height:1.5}
.trust-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.trust-grid div{font-size:11.5px;color:var(--dim);display:flex;gap:6px;align-items:center}
.trust-grid svg{width:13px;height:13px;color:var(--jade);flex:0 0 auto}

/* ---------- PROVIDER CARDS ---------- */
.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;margin:0 -18px 0;padding-inline:18px}
.pill{border:1px solid var(--line-2);border-radius:999px;padding:7px 13px;font-size:12px;color:var(--dim);
  white-space:nowrap;transition:.18s;flex:0 0 auto}
.pill:hover{color:var(--pearl);border-color:var(--pearl)}
.pill.on{background:var(--pearl);color:var(--ink);border-color:var(--pearl);font-weight:700}

.pcard{border:1px solid var(--line);background:var(--ink-2);border-radius:var(--r-l);padding:14px;
  margin-bottom:11px;transition:.2s;text-align:start;width:100%;display:block;position:relative;overflow:hidden}
.pcard:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--sh-2)}
.pcard.unclaimed{border-style:dashed;border-color:rgba(255,199,115,.35)}
.pcard-top{display:flex;gap:12px;align-items:flex-start}

/* SIGNATURE: the Arrival Ring — minutes-to-you as a conic ring around the avatar */
.ring{
  --p:60;width:60px;height:60px;border-radius:50%;flex:0 0 auto;position:relative;display:grid;place-items:center;
  background:conic-gradient(var(--bulb) calc(var(--p)*1%),rgba(244,237,228,.10) 0);
}
.ring::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ink-2)}
.ring.slow{background:conic-gradient(var(--lacquer) calc(var(--p)*1%),rgba(244,237,228,.10) 0)}
.avatar{position:relative;z-index:1;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--ff-display);font-weight:700;font-size:17px;color:var(--ink);letter-spacing:.02em}
.ring-eta{position:absolute;bottom:-7px;inset-inline-start:50%;transform:translateX(-50%);z-index:2;
  background:var(--bulb);color:var(--ink);font-size:9.5px;font-weight:900;padding:1.5px 6px;border-radius:999px;
  white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.5)}
[dir=rtl] .ring-eta{transform:translateX(50%)}
.ring.slow .ring-eta{background:var(--lacquer);color:#fff}

.pmeta{flex:1;min-width:0}
.pname{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;line-height:1.25}
.pname svg{width:14px;height:14px;color:var(--jade);flex:0 0 auto}
.psub{font-size:11.5px;color:var(--mute);margin-top:2px}
.prow{display:flex;align-items:center;gap:10px;margin-top:7px;flex-wrap:wrap}
.star{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700}
.star svg{width:13px;height:13px;color:var(--bulb)}
.star em{font-style:normal;color:var(--mute);font-weight:400;font-size:11.5px}
.dot{width:3px;height:3px;border-radius:50%;background:var(--mute)}
.dist{font-size:11.5px;color:var(--dim)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:10.5px;padding:3px 8px;border-radius:999px;background:var(--surf);color:var(--dim);
  border:1px solid var(--line)}
.tag.gold{background:var(--bulb-soft);color:var(--bulb);border-color:rgba(255,199,115,.3)}
.tag.jade{background:var(--jade-soft);color:var(--jade);border-color:rgba(74,222,155,.3)}
.tag.rose{background:var(--lacquer-soft);color:var(--lacquer);border-color:rgba(255,77,109,.3)}
.pfoot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:11px;
  border-top:1px solid var(--line)}
.price b{font-family:var(--ff-display);font-size:19px;font-weight:700}
.price span{font-size:11px;color:var(--mute);display:block;line-height:1}
.gopill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink);
  background:var(--pearl);padding:8px 14px;border-radius:999px;transition:.2s}
.pcard:hover .gopill{background:var(--bulb)}
.gopill svg{width:13px;height:13px}
[dir=rtl] .gopill svg{transform:scaleX(-1)}
.livebar{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--mute);
  margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.livebar svg{width:12px;height:12px;color:var(--bulb)}

/* ---------- SERVICES ---------- */
.probanner{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);
  border-radius:var(--r-l);background:var(--ink-2);margin-bottom:14px}
.svc{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);
  border-radius:var(--r-m);background:var(--ink-2);margin-bottom:8px;transition:.18s;width:100%;text-align:start}
.svc:hover{border-color:var(--line-2)}
.svc.on{border-color:var(--lacquer);background:linear-gradient(160deg,var(--lacquer-soft),transparent 70%)}
.svc-i{width:38px;height:38px;border-radius:11px;background:var(--surf);display:grid;place-items:center;flex:0 0 auto}
.svc-i svg{width:18px;height:18px;color:var(--bulb)}
.svc.on .svc-i{background:var(--lacquer);}
.svc.on .svc-i svg{color:#fff}
.svc-m{flex:1;min-width:0}
.svc-m b{display:block;font-size:13.5px;font-weight:500}
.svc-m span{font-size:11px;color:var(--mute)}
.svc-p{text-align:end;flex:0 0 auto}
.svc-p b{font-size:14px;font-weight:700;display:block}
.svc-p s{font-size:10.5px;color:var(--mute)}
.svc-p em{font-style:normal;font-size:10px;color:var(--bulb);display:block}

.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.slot{border:1px solid var(--line);border-radius:var(--r-s);padding:9px 4px;font-size:12px;text-align:center;
  color:var(--dim);transition:.18s;font-weight:500}
.slot:hover{border-color:var(--pearl);color:var(--pearl)}
.slot.on{background:var(--bulb);color:var(--ink);border-color:var(--bulb);font-weight:700}
.slot.asap{color:var(--bulb)}
.slot.asap.on{color:var(--ink)}
.slot:disabled{opacity:.3;cursor:not-allowed}

/* FRESH-Shield banner */
.shield{border:1px solid rgba(74,222,155,.3);border-radius:var(--r-l);padding:14px;margin:16px 0;
  background:linear-gradient(150deg,var(--jade-soft),transparent 70%);display:flex;gap:12px;align-items:flex-start}
.shield svg{width:20px;height:20px;color:var(--jade);flex:0 0 auto;margin-top:1px}
.shield b{font-size:13.5px;display:block;margin-bottom:4px}
.shield p{font-size:12px;color:var(--dim);line-height:1.5}
.shield button{font-size:11.5px;color:var(--jade);font-weight:700;margin-top:7px;text-decoration:underline}

/* ---------- CHECKOUT ---------- */
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:700;
  margin:18px 0 9px;display:block}
[dir=rtl] .lbl{letter-spacing:.05em}
.inputs2{display:grid;grid-template-columns:1.6fr 1fr;gap:9px}
.pay{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);
  border-radius:var(--r-m);background:var(--ink-2);margin-bottom:8px;width:100%;text-align:start;transition:.18s}
.pay.on{border-color:var(--pearl);background:var(--surf)}
.pay-i{width:42px;height:28px;border-radius:6px;background:var(--surf-2);display:grid;place-items:center;flex:0 0 auto}
.pay-i svg{width:18px;height:18px}
.pay b{font-size:13px;font-weight:500;display:block}
.pay span{font-size:11px;color:var(--mute)}
.radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);margin-inline-start:auto;
  flex:0 0 auto;display:grid;place-items:center}
.pay.on .radio{border-color:var(--bulb)}
.pay.on .radio::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--bulb)}

.bill{border:1px solid var(--line);border-radius:var(--r-l);background:var(--ink-2);padding:14px;margin-top:14px}
.bill-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;color:var(--dim)}
.bill-row b{color:var(--pearl);font-weight:500}
.bill-row.disc{color:var(--jade)}
.bill-row.disc b{color:var(--jade)}
.bill-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;padding-top:11px;
  border-top:1px solid var(--line)}
.bill-total span{font-size:12.5px;color:var(--mute)}
.bill-total b{font-family:var(--ff-display);font-size:26px;font-weight:900}
.tiny{font-size:11px;color:var(--mute);line-height:1.5;margin-top:9px}

/* ---------- BUTTONS / CTA ---------- */
.cta{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:53px;
  border-radius:var(--r-m);background:var(--bulb);color:var(--ink);font-size:15px;font-weight:900;
  transition:.2s;box-shadow:var(--sh-glow);
}
.cta:hover{filter:brightness(1.07);transform:translateY(-1px)}
.cta:disabled{opacity:.35;box-shadow:none;cursor:not-allowed;transform:none}
.cta svg{width:18px;height:18px}
.cta.ghost{background:transparent;color:var(--pearl);border:1px solid var(--line-2);box-shadow:none}
.cta.ghost:hover{border-color:var(--pearl)}
.cta.rose{background:var(--lacquer);color:#fff;box-shadow:0 0 0 1px rgba(255,77,109,.3),0 8px 30px -8px rgba(255,77,109,.5)}
.dock{flex:0 0 auto;padding:12px 18px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:linear-gradient(180deg,transparent,var(--ink-2) 40%);
  backdrop-filter:blur(10px)}
.dock-info{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-size:12px;color:var(--mute)}
.dock-info b{font-family:var(--ff-display);font-size:20px;font-weight:700;color:var(--pearl)}

/* ---------- TRACKER ---------- */
.mapbox{position:relative;height:290px;flex:0 0 auto;background:#1A1512}
#anmap{position:absolute;inset:0;z-index:1}
.leaflet-container{background:#1A1512!important;font-family:var(--ff-ui)!important}
.leaflet-control-attribution{background:rgba(20,16,14,.75)!important;color:var(--mute)!important;font-size:9px!important}
.leaflet-control-attribution a{color:var(--dim)!important}
.leaflet-bar a{background:var(--surf)!important;color:var(--pearl)!important;border-color:var(--line)!important}
.pin-pro{background:none!important;border:0!important}
.pin-pro .pp{width:38px;height:38px;border-radius:50%;border:2px solid var(--bulb);display:grid;place-items:center;
  font-family:var(--ff-display);font-weight:700;font-size:14px;color:var(--ink);
  box-shadow:0 0 0 4px rgba(255,199,115,.22),0 6px 16px rgba(0,0,0,.6)}
.pin-me{background:none!important;border:0!important}
.pin-me .mm{width:16px;height:16px;border-radius:50%;background:var(--lacquer);border:3px solid #fff;
  box-shadow:0 0 0 6px rgba(255,77,109,.25);animation:mepulse 2.4s infinite}
@keyframes mepulse{0%,100%{box-shadow:0 0 0 6px rgba(255,77,109,.25)}50%{box-shadow:0 0 0 13px rgba(255,77,109,0)}}
.fallmap{position:absolute;inset:0;z-index:1;overflow:hidden;
  background:
    radial-gradient(circle at 50% 60%,rgba(255,199,115,.10),transparent 62%),
    repeating-linear-gradient(0deg,transparent 0 27px,rgba(244,237,228,.05) 27px 28px),
    repeating-linear-gradient(90deg,transparent 0 27px,rgba(244,237,228,.05) 27px 28px),#1A1512}
.fallmap .fm-me{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);width:16px;height:16px;
  border-radius:50%;background:var(--lacquer);border:3px solid #fff;animation:mepulse 2.4s infinite}
.fallmap .fm-pro{position:absolute;transform:translate(-50%,-50%);transition:all 1s linear;width:34px;height:34px;
  border-radius:50%;border:2px solid var(--bulb);display:grid;place-items:center;font-weight:700;font-size:13px;
  color:var(--ink);font-family:var(--ff-display)}
.maptop{position:absolute;top:0;inset-inline:0;z-index:20;padding:14px 16px;display:flex;gap:9px;align-items:center;
  background:linear-gradient(180deg,rgba(20,16,14,.9),transparent)}
.mapchip{background:rgba(20,16,14,.85);border:1px solid var(--line-2);border-radius:999px;padding:7px 12px;
  font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;backdrop-filter:blur(8px)}
.mapchip svg{width:13px;height:13px;color:var(--bulb)}
.sos{margin-inline-start:auto;background:var(--lacquer);color:#fff;border-radius:999px;padding:8px 14px;
  font-size:12px;font-weight:900;letter-spacing:.06em;box-shadow:0 4px 14px rgba(255,77,109,.4)}

.tsheet{flex:1;min-height:0;overflow-y:auto;margin-top:-22px;position:relative;z-index:10;border-radius:24px 24px 0 0;
  background:var(--ink-2);border-top:1px solid var(--line-2);padding:16px 18px 26px}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line-2);margin:0 auto 14px}
.tstate{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.tstate .ring{width:54px;height:54px}
.tstate .avatar{width:44px;height:44px;font-size:16px}
.tstate h4{font-size:16px;font-weight:700}
.tstate p{font-size:12px;color:var(--mute);margin-top:2px}
.tactions{display:flex;gap:8px;margin-inline-start:auto}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;
  color:var(--dim);transition:.18s}
.iconbtn:hover{color:var(--ink);background:var(--bulb);border-color:var(--bulb)}
.iconbtn svg{width:16px;height:16px}

.pinbox{border:1px solid rgba(255,199,115,.35);background:linear-gradient(150deg,var(--bulb-soft),transparent 70%);
  border-radius:var(--r-l);padding:15px;text-align:center;margin-bottom:14px}
.pinbox span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--bulb);font-weight:700}
[dir=rtl] .pinbox span{letter-spacing:.05em}
.pindigits{display:flex;gap:9px;justify-content:center;margin:11px 0 8px}
.pindigits b{width:44px;height:54px;border-radius:12px;background:var(--ink);border:1px solid var(--line-2);
  display:grid;place-items:center;font-family:var(--ff-display);font-size:26px;font-weight:900}
.pinbox p{font-size:11.5px;color:var(--dim);line-height:1.45}

.steps{position:relative;padding-inline-start:26px;margin:6px 0 4px}
.steps::before{content:"";position:absolute;inset-inline-start:8px;top:8px;bottom:8px;width:2px;background:var(--line)}
.step{position:relative;padding:9px 0}
.step::before{content:"";position:absolute;inset-inline-start:-24px;top:13px;width:12px;height:12px;border-radius:50%;
  background:var(--ink-2);border:2px solid var(--line-2)}
.step.done::before{background:var(--jade);border-color:var(--jade)}
.step.now::before{background:var(--bulb);border-color:var(--bulb);box-shadow:0 0 0 4px rgba(255,199,115,.2)}
.step b{font-size:13px;font-weight:500;display:block;color:var(--mute)}
.step.done b,.step.now b{color:var(--pearl)}
.step span{font-size:11px;color:var(--mute)}

/* request-to-book broadcast log */
.broadcast{text-align:center;padding:10px 0 4px}
.bigtimer{font-family:var(--ff-display);font-size:52px;font-weight:900;letter-spacing:.02em;line-height:1}
.bigtimer.hot{color:var(--lacquer)}
.broadcast>p{font-size:12.5px;color:var(--dim);margin-top:6px}
.log{margin-top:16px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--ink);padding:11px;
  max-height:172px;overflow-y:auto}
.logline{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;padding:5px 0;color:var(--dim);
  animation:slidein .35s ease both}
@keyframes slidein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.logline svg{width:13px;height:13px;flex:0 0 auto;margin-top:2px;color:var(--mute)}
.logline.ok{color:var(--jade)}.logline.ok svg{color:var(--jade)}
.logline.wa svg{color:#25D366}
.logline time{margin-inline-start:auto;color:var(--mute);font-size:10px;flex:0 0 auto}

/* ---------- SHEETS / MODALS ---------- */
.scrim{position:absolute;inset:0;background:rgba(8,6,5,.72);backdrop-filter:blur(3px);z-index:80;
  display:flex;align-items:flex-end;animation:fade .25s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--ink-2);border-top:1px solid var(--line-2);border-radius:26px 26px 0 0;width:100%;
  max-height:88%;overflow-y:auto;padding:18px 18px 26px;animation:up .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet h3{font-family:var(--ff-display);font-size:20px;font-weight:700;margin-bottom:6px}
.sheet>p{font-size:13px;color:var(--dim);line-height:1.55}
.sheet-close{position:absolute;top:14px;inset-inline-end:16px;width:32px;height:32px;border-radius:50%;
  background:var(--surf);display:grid;place-items:center;color:var(--dim);z-index:2}
.sheet-close svg{width:15px;height:15px}
.slist{margin-top:14px}
.sitem{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.sitem:last-child{border-bottom:0}
.sitem svg{width:17px;height:17px;color:var(--jade);flex:0 0 auto;margin-top:2px}
.sitem b{display:block;font-size:13px;font-weight:700;margin-bottom:2px}
.sitem p{font-size:12px;color:var(--mute);line-height:1.45}
.sitem.rose svg{color:var(--lacquer)}
.sitem.gold svg{color:var(--bulb)}

.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}
.key{height:54px;border-radius:var(--r-m);background:var(--surf);font-size:20px;font-weight:700;transition:.12s;
  font-family:var(--ff-display)}
.key:active{background:var(--bulb);color:var(--ink)}
.key.fn{font-size:13px;font-family:var(--ff-ui);color:var(--dim)}
.pinin{display:flex;gap:10px;justify-content:center;margin:16px 0 4px}
.pinin i{width:48px;height:58px;border-radius:12px;border:1px solid var(--line-2);background:var(--ink);
  display:grid;place-items:center;font-family:var(--ff-display);font-size:28px;font-weight:900;font-style:normal}
.pinin i.filled{border-color:var(--bulb)}
.pinin.bad i{border-color:var(--lacquer);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* success */
.done-wrap{text-align:center;padding:26px 6px}
.done-ring{width:92px;height:92px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;
  background:var(--jade-soft);border:2px solid var(--jade);animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.done-ring svg{width:42px;height:42px;color:var(--jade)}
.done-wrap h3{font-family:var(--ff-display);font-size:24px;font-weight:900;margin-bottom:8px}
.done-wrap p{font-size:13.5px;color:var(--dim);line-height:1.55}
.stars{display:flex;gap:9px;justify-content:center;margin:20px 0}
.stars button{width:40px;height:40px;color:var(--line-2);transition:.15s}
.stars button svg{width:100%;height:100%}
.stars button.on{color:var(--bulb);transform:scale(1.12)}

/* ---------- PRO CONSOLE ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.kpi{border:1px solid var(--line);border-radius:var(--r-m);background:var(--ink-2);padding:13px}
.kpi span{font-size:11px;color:var(--mute);display:block}
.kpi b{font-family:var(--ff-display);font-size:24px;font-weight:900;display:block;margin-top:3px}
.kpi em{font-style:normal;font-size:11px;color:var(--jade)}
.reqcard{border:1px solid var(--bulb);border-radius:var(--r-l);background:linear-gradient(160deg,var(--bulb-soft),transparent 70%);
  padding:14px;margin-bottom:11px}
.reqcard .rc-t{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.reqcard .rc-t b{font-size:14px;font-weight:700}
.rc-timer{font-size:12px;font-weight:900;color:var(--bulb);font-variant-numeric:tabular-nums}
.rc-row{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);padding:3px 0}
.rc-row b{color:var(--pearl);font-weight:500}
.rc-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mini{height:42px;border-radius:var(--r-s);font-size:13px;font-weight:700}
.mini.acc{background:var(--jade);color:var(--ink)}
.mini.dec{border:1px solid var(--line-2);color:var(--dim)}
.claimcard{border:1px dashed rgba(255,199,115,.4);border-radius:var(--r-l);padding:14px;background:var(--ink-2)}
.progress{height:5px;border-radius:5px;background:var(--surf);overflow:hidden;margin-top:11px}
.progress i{display:block;height:100%;background:var(--bulb);width:0;transition:width .3s}

/* ---------- TOAST ---------- */
.toast{position:absolute;bottom:24px;inset-inline:18px;z-index:100;background:var(--pearl);color:var(--ink);
  border-radius:var(--r-m);padding:12px 15px;font-size:13px;font-weight:700;display:flex;gap:9px;align-items:center;
  box-shadow:0 12px 40px rgba(0,0,0,.6);animation:up .3s cubic-bezier(.2,.8,.2,1) both}
.toast svg{width:17px;height:17px;flex:0 0 auto}

/* ---------- TAILWIND-COMPATIBLE UTILITY SHIM ----------
   Same class names and values Tailwind emits, so the new panels keep their
   layout even if the Play CDN is blocked on venue wifi. ------------------- */
.flex{display:flex}.grid{display:grid}.hidden{display:none}.relative{position:relative}
.items-center{align-items:center}.items-start{align-items:flex-start}
.justify-between{justify-content:space-between}.flex-1{flex:1 1 0%}.flex-wrap{flex-wrap:wrap}
.gap-1{gap:4px}.gap-2{gap:8px}.gap-3{gap:12px}
.grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mt-2{margin-top:8px}.mt-3{margin-top:12px}.w-full{width:100%}.min-w-0{min-width:0}
.text-xs{font-size:12px;line-height:16px}.font-bold{font-weight:700}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- LIVE DATA / SCRAPER ENGINES ---------- */
.engine{border:1px solid var(--line);border-radius:var(--r-l);background:var(--ink-2);padding:13px;margin-bottom:11px}
.engine-h{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.engine-h svg{width:16px;height:16px;color:var(--bulb)}
.engine-h b{font-size:13px;font-weight:700;flex:1}
.srcbadge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid var(--line-2);
  color:var(--dim);letter-spacing:.04em;white-space:nowrap}
.srcbadge.live{color:var(--jade);border-color:rgba(74,222,155,.35);background:var(--jade-soft)}
.srcbadge.osm{color:var(--bulb);border-color:rgba(255,199,115,.35);background:var(--bulb-soft)}
.srcbadge.demo{color:var(--mute)}
.srcbadge.err{color:var(--lacquer);border-color:rgba(255,77,109,.35);background:var(--lacquer-soft)}
.engine-line{font-size:12px;color:var(--dim);line-height:1.45}
.engine-line b{color:var(--pearl)}
.engine-act{display:flex;gap:7px;margin-top:11px}
.ebtn{flex:1;height:38px;border-radius:var(--r-s);border:1px solid var(--line-2);font-size:12.5px;
  font-weight:700;color:var(--dim);transition:.18s;display:flex;align-items:center;justify-content:center;gap:6px}
.ebtn:hover{color:var(--pearl);border-color:var(--pearl)}
.ebtn.pri{background:var(--bulb);color:var(--ink);border-color:var(--bulb)}
.ebtn svg{width:14px;height:14px}
.escan{height:3px;border-radius:3px;background:var(--surf);overflow:hidden;margin-top:10px;position:relative}
.escan i{position:absolute;inset-block:0;width:38%;background:linear-gradient(90deg,transparent,var(--bulb),transparent);
  animation:sweep 1.5s linear infinite}
@keyframes sweep{from{inset-inline-start:-40%}to{inset-inline-start:100%}}

.sq{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.sq div{border:1px solid var(--line);border-radius:var(--r-s);background:var(--ink-2);padding:9px 6px;text-align:center}
.sq b{display:block;font-family:var(--ff-display);font-size:19px;font-weight:900;line-height:1.1}
.sq span{font-size:9.5px;color:var(--mute);display:block;margin-top:2px;line-height:1.25}

.cand{border:1px solid var(--line);border-radius:var(--r-m);background:var(--ink-2);padding:11px;margin-bottom:8px;
  display:flex;gap:10px;align-items:flex-start;animation:slidein .3s ease both}
.cand.hot{border-color:rgba(255,199,115,.45);background:linear-gradient(160deg,var(--bulb-soft),transparent 70%)}
.cand.ok{border-color:rgba(74,222,155,.4)}
.cand .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  font-family:var(--ff-display);font-weight:700;font-size:14px;color:var(--ink)}
.cand-m{flex:1;min-width:0}
.cand-m b{font-size:13px;font-weight:700;display:block}
.cand-m .hnd{font-size:11px;color:var(--mute);display:flex;align-items:center;gap:5px;margin-top:2px}
.cand-m .hnd svg{width:11px;height:11px}
.cand-st{font-size:11px;margin-top:6px;display:flex;align-items:center;gap:6px;color:var(--dim)}
.cand-st svg{width:12px;height:12px}
.cand.hot .cand-st{color:var(--bulb)}.cand.ok .cand-st{color:var(--jade)}
.cand-cd{font-size:11px;font-weight:900;color:var(--bulb);font-variant-numeric:tabular-nums;flex:0 0 auto;
  border:1px solid rgba(255,199,115,.35);border-radius:999px;padding:3px 8px}
.cand-claim{font-size:11px;font-weight:900;background:var(--jade);color:var(--ink);border-radius:999px;
  padding:6px 11px;flex:0 0 auto}
.scanbar{height:3px;border-radius:3px;background:var(--surf);overflow:hidden;margin-top:8px}
.scanbar i{display:block;height:100%;background:var(--bulb);transition:width .4s}

.rev{border-top:1px solid var(--line);padding:10px 0;font-size:12px;color:var(--dim);line-height:1.5}
.rev:last-child{border-bottom:0}
.rev-h{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.rev-h b{font-size:12.5px;color:var(--pearl);font-weight:700}
.rev-h .rs{display:flex;gap:1px}
.rev-h .rs svg{width:11px;height:11px;color:var(--bulb)}
.rev-h time{margin-inline-start:auto;font-size:10.5px;color:var(--mute)}

.cfgfield{display:flex;align-items:center;gap:9px;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r-m);padding:0 13px;height:46px}
.cfgfield input{flex:1;background:none;border:0;outline:0;font-size:13px;min-width:0;font-family:ui-monospace,monospace}
.cfgfield svg{width:16px;height:16px;color:var(--mute)}
.loglist{border:1px solid var(--line);border-radius:var(--r-m);background:var(--ink);padding:10px;margin-top:9px;
  max-height:150px;overflow-y:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;line-height:1.6}
.loglist div{color:var(--mute);padding:1px 0;word-break:break-all}
.loglist div.ok{color:var(--jade)}.loglist div.err{color:var(--lacquer)}.loglist div.warn{color:var(--bulb)}

/* ---------- PLACES AUTOCOMPLETE ---------- */
.acwrap{position:relative;z-index:30}
.acmenu{position:absolute;inset-inline:0;top:calc(100% + 6px);background:var(--ink-2);border:1px solid var(--line-2);
  border-radius:var(--r-m);box-shadow:var(--sh-2);overflow:hidden;max-height:262px;overflow-y:auto}
.acitem{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;width:100%;text-align:start;
  border-bottom:1px solid var(--line);transition:.14s}
.acitem:last-child{border-bottom:0}
.acitem:hover{background:var(--surf)}
.acitem svg{width:15px;height:15px;color:var(--bulb);margin-top:2px}
.acitem b{display:block;font-size:13px;font-weight:500}
.acitem span{display:block;font-size:11px;color:var(--mute);line-height:1.35;margin-top:1px}
.acfoot{padding:8px 13px;font-size:10px;color:var(--mute);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:6px;background:var(--ink)}
.acfoot svg{width:11px;height:11px}

/* ---------- 30-SECOND ONBOARDING ---------- */
.obsteps{display:flex;gap:5px;padding:0 0 14px}
.obsteps i{height:3px;flex:1;border-radius:3px;background:rgba(244,237,228,.11);transition:.35s}
.obsteps i.done{background:rgba(74,222,155,.5)}
.obsteps i.now{background:var(--bulb);box-shadow:0 0 10px rgba(255,199,115,.6)}
.plat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.plat button{border:1px solid var(--line-2);border-radius:var(--r-m);padding:12px 6px;text-align:center;transition:.18s}
.plat button svg{width:20px;height:20px;margin:0 auto 6px;color:var(--dim)}
.plat button b{font-size:11px;font-weight:500;display:block}
.plat button.on{border-color:var(--lacquer);background:var(--lacquer-soft)}
.plat button.on svg{color:var(--lacquer)}
.consent{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line-2);border-radius:var(--r-m);
  padding:13px;background:var(--ink-2);width:100%;text-align:start;transition:.18s}
.consent.on{border-color:var(--jade);background:linear-gradient(160deg,var(--jade-soft),transparent 70%)}
.cbox{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);flex:0 0 auto;display:grid;
  place-items:center;margin-top:1px}
.consent.on .cbox{background:var(--jade);border-color:var(--jade)}
.cbox svg{width:13px;height:13px;color:var(--ink);opacity:0}
.consent.on .cbox svg{opacity:1}
.consent b{font-size:13px;font-weight:700;display:block;margin-bottom:3px}
.consent p{font-size:11.5px;color:var(--mute);line-height:1.45}
.ingest{text-align:center;padding:8px 0 4px}
.ingring{width:118px;height:118px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--bulb) calc(var(--p)*1%),rgba(244,237,228,.09) 0)}
.ingring::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--ink)}
.ingring b{position:relative;z-index:1;font-family:var(--ff-display);font-size:34px;font-weight:900;line-height:1}
.ingring span{position:relative;z-index:1;font-size:10px;color:var(--mute);display:block;margin-top:2px}
.ingstage{font-size:13.5px;font-weight:700;margin-bottom:4px}
.ingsub{font-size:11.5px;color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:16px}
.tile{aspect-ratio:1;border-radius:10px;background:var(--surf);position:relative;overflow:hidden;
  display:grid;place-items:center;border:1px solid var(--line)}
.tile.on{animation:pop .38s cubic-bezier(.2,1.5,.4,1) both;border-color:transparent}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile svg{width:20px;height:20px;color:rgba(20,16,14,.4)}
.tile .sk{position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(244,237,228,.07),transparent);
  animation:sweep 1.3s linear infinite}
.obcard{border:1px solid var(--line-2);border-radius:var(--r-l);background:var(--ink-2);padding:14px;margin-top:6px}
.obhead{display:flex;gap:12px;align-items:center}
.obpic{width:56px;height:56px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;overflow:hidden;
  font-family:var(--ff-display);font-weight:700;font-size:19px;color:var(--ink)}
.obpic img{width:100%;height:100%;object-fit:cover}
.obbio{font-size:12px;color:var(--dim);line-height:1.5;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}

/* ---------- GALLERY SHOWCASE ---------- */
.gwrap{margin:12px 0 2px}
.ghead{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.ghead b{font-size:13px;font-weight:700}
.ghead span{font-size:11px;color:var(--mute);margin-inline-start:auto;display:flex;align-items:center;gap:5px}
.ghead span svg{width:12px;height:12px}
.gstrip{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-inline:-18px;padding-inline:18px}
.gstrip button{width:88px;height:88px;border-radius:12px;flex:0 0 auto;overflow:hidden;position:relative;
  border:1px solid var(--line);display:grid;place-items:center}
.gstrip button img{width:100%;height:100%;object-fit:cover}
.gstrip button svg{width:20px;height:20px;color:rgba(20,16,14,.42)}
.gstrip button:hover{border-color:var(--bulb)}
.gbig{width:100%;aspect-ratio:1;border-radius:var(--r-l);overflow:hidden;display:grid;place-items:center;margin-bottom:12px}
.gbig img{width:100%;height:100%;object-fit:cover}
.gbig svg{width:52px;height:52px;color:rgba(20,16,14,.4)}
.gthumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.gthumbs button{aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line);display:grid;place-items:center}
.gthumbs button.on{border-color:var(--bulb)}
.gthumbs button img{width:100%;height:100%;object-fit:cover}
.gthumbs button svg{width:13px;height:13px;color:rgba(20,16,14,.4)}
.gmini{display:flex;gap:4px;margin-top:9px}
.gmini i{width:34px;height:34px;border-radius:8px;flex:0 0 auto;display:block;overflow:hidden;border:1px solid var(--line)}
.gmini i img{width:100%;height:100%;object-fit:cover}

/* ---------- CARD FORM ---------- */
.cardbox{border:1px solid var(--line-2);border-radius:var(--r-l);background:var(--ink-2);padding:13px;margin-top:9px}
.cardrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cfield{display:flex;align-items:center;gap:9px;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r-s);padding:0 12px;height:46px;transition:.16s}
.cfield:focus-within{border-color:var(--bulb)}
.cfield.bad{border-color:var(--lacquer)}
.cfield input{flex:1;background:none;border:0;outline:0;font-size:14px;min-width:0;letter-spacing:.03em;
  font-variant-numeric:tabular-nums}
.cfield input::placeholder{color:var(--mute);letter-spacing:0}
.cfield svg{width:16px;height:16px;color:var(--mute)}
.brand{font-size:10px;font-weight:900;letter-spacing:.08em;color:var(--bulb);white-space:nowrap}
.cerr{font-size:11px;color:var(--lacquer);margin-top:6px;display:flex;align-items:center;gap:5px}
.cerr svg{width:12px;height:12px}
.applebtn{height:50px;border-radius:var(--r-m);background:var(--pearl);color:#000;display:flex;align-items:center;
  justify-content:center;gap:7px;width:100%;font-weight:700;font-size:15px;margin-top:9px}
.applebtn svg{width:19px;height:19px}
.preauth{display:flex;gap:10px;align-items:flex-start;border:1px solid rgba(255,199,115,.3);border-radius:var(--r-m);
  padding:11px 12px;background:var(--bulb-soft);margin-top:10px}
.preauth svg{width:16px;height:16px;color:var(--bulb);flex:0 0 auto;margin-top:1px}
.preauth b{font-size:12px;display:block;margin-bottom:2px}
.preauth p{font-size:11px;color:var(--dim);line-height:1.45}

/* ---------- SCHEDULING ---------- */
.daystrip{display:flex;gap:7px;overflow-x:auto;margin-inline:-18px;padding:2px 18px 12px}
.day{flex:0 0 auto;min-width:62px;border:1px solid var(--line-2);border-radius:var(--r-m);padding:9px 10px;
  text-align:center;transition:.18s}
.day b{display:block;font-size:13px;font-weight:700}
.day span{display:block;font-size:10.5px;color:var(--mute);margin-top:2px}
.day.on{background:var(--pearl);color:var(--ink);border-color:var(--pearl)}
.day.on span{color:rgba(20,16,14,.6)}
.day.asap{border-color:rgba(255,199,115,.45);background:var(--bulb-soft)}
.day.asap b{color:var(--bulb)}
.day.asap.on{background:var(--bulb);border-color:var(--bulb)}
.day.asap.on b{color:var(--ink)}
.wins{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.win{border:1px solid var(--line);border-radius:var(--r-s);padding:9px 4px;text-align:center;transition:.18s}
.win b{display:block;font-size:12px;font-weight:500}
.win span{display:block;font-size:10px;color:var(--mute);margin-top:1px}
.win.on{border-color:var(--lacquer);background:var(--lacquer-soft)}
.appt{border:1px solid rgba(255,199,115,.35);border-radius:var(--r-l);padding:15px;text-align:center;
  background:linear-gradient(150deg,var(--bulb-soft),transparent 70%);margin-bottom:14px}
.appt span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bulb);font-weight:700}
[dir=rtl] .appt span{letter-spacing:.04em}
.appt b{display:block;font-family:var(--ff-display);font-size:27px;font-weight:900;margin:7px 0 3px}
.appt p{font-size:12px;color:var(--dim)}
.cdgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cdgrid div{background:var(--ink);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 4px}
.cdgrid b{display:block;font-family:var(--ff-display);font-size:21px;font-weight:900;line-height:1}
.cdgrid span{font-size:9.5px;color:var(--mute);letter-spacing:0;text-transform:none}

/* ---------- SHADOW PROFILE CLAIMING ---------- */
.shadowcta{display:flex;align-items:center;gap:9px;width:100%;margin-top:10px;padding:10px 12px;
  border:1px solid rgba(255,199,115,.45);border-radius:var(--r-m);background:var(--bulb-soft);text-align:start;
  transition:.18s}
.shadowcta:hover{background:rgba(255,199,115,.2)}
.shadowcta svg{width:16px;height:16px;color:var(--bulb);flex:0 0 auto}
.shadowcta b{display:block;font-size:12.5px;font-weight:700;color:var(--bulb)}
.shadowcta span{display:block;font-size:11px;color:var(--dim);margin-top:1px}
.otpin{display:flex;gap:7px;justify-content:center;margin:16px 0 6px}
.otpin i{width:40px;height:50px;border-radius:10px;border:1px solid var(--line-2);background:var(--ink);
  display:grid;place-items:center;font-family:var(--ff-display);font-size:22px;font-weight:900;font-style:normal}
.otpin i.filled{border-color:var(--bulb)}
.otpin.bad i{border-color:var(--lacquer);animation:shake .4s}

/* ---------- COMPLIANCE ---------- */
.comply{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.comply div{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--dim);
  border:1px solid var(--line);border-radius:var(--r-s);padding:8px 9px;background:var(--ink)}
.comply svg{width:13px;height:13px;color:var(--jade);flex:0 0 auto}
.tplbox{border:1px solid var(--line);border-radius:var(--r-m);background:var(--ink);padding:12px;margin-top:10px;
  font-size:12px;line-height:1.6;color:var(--dim);position:relative}
.tplbox b{color:var(--pearl);font-weight:700}
.tplbox .optout{display:block;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--bulb);font-weight:700}
.throt{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mute);margin-top:10px}
.throt b{color:var(--bulb);font-variant-numeric:tabular-nums;font-weight:900}
.cand.out{opacity:.55;border-style:dashed}
.cand.blk{border-color:rgba(255,77,109,.4)}
.cand.blk .cand-st{color:var(--lacquer)}

/* ---------- LEGAL ---------- */
.legal{border:1px solid var(--line-2);border-radius:var(--r-l);padding:14px;background:var(--ink-2);margin-top:14px}
.legal-h{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.legal-h svg{width:17px;height:17px;color:var(--dim)}
.legal-h b{font-size:13px;font-weight:700}
.legal p{font-size:11.5px;color:var(--mute);line-height:1.55}
.legal button.more{font-size:11.5px;color:var(--bulb);font-weight:700;text-decoration:underline;margin-top:8px}
.tosrow{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line-2);border-radius:var(--r-m);
  padding:12px;background:var(--ink-2);margin-top:10px;width:100%;text-align:start;transition:.18s}
.tosrow.on{border-color:var(--jade);background:linear-gradient(160deg,var(--jade-soft),transparent 70%)}
.tosrow .cbox{margin-top:0}
.tosrow span.txt{font-size:12px;line-height:1.45}
.bench{width:100%;border-collapse:collapse;margin-top:12px;font-size:11.5px}
.bench th,.bench td{border-bottom:1px solid var(--line);padding:9px 6px;text-align:start;vertical-align:top}
.bench th{color:var(--mute);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
[dir=rtl] .bench th{letter-spacing:0}
.bench td b{color:var(--bulb)}
.bench tr td:first-child{color:var(--pearl);font-weight:700;width:34%}

/* ---------- BACKEND STATUS BADGE ---------- */
.statusbadge{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;
  font-size:10.5px;font-weight:900;letter-spacing:.1em;border:1px solid var(--line-2);color:var(--mute);
  white-space:nowrap;transition:.25s;font-variant-numeric:tabular-nums}
[dir=rtl] .statusbadge{letter-spacing:.04em}
.statusbadge i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
.statusbadge.online{color:#10B981;background:rgba(16,185,129,.13);border-color:rgba(16,185,129,.45)}
.statusbadge.online i{animation:livedot 2s infinite}
@keyframes livedot{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.55)}70%{box-shadow:0 0 0 6px rgba(16,185,129,0)}}
.statusbadge.fallback{color:var(--bulb);background:var(--bulb-soft);border-color:rgba(255,199,115,.4)}
.statusbadge.offline{color:var(--lacquer);background:var(--lacquer-soft);border-color:rgba(255,77,109,.4)}
.statusbadge.checking i{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- RESPONSIVE ---------- */
@media (max-width:1080px){
  .rail{display:none}
  .stage-body{padding:0;justify-content:center}
  .device{width:100%;flex:1 1 auto;max-width:440px;height:calc(100dvh - 62px);max-height:none;
    border-radius:0;border:0;padding:0;box-shadow:none;background:var(--ink)}
  .screenwrap{border-radius:0}
  .notch{display:none}
}
@media (max-width:520px){
  .topbar{padding:10px 12px;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tbtn span{display:none}
  .tbtn{padding:8px 11px}
  .tbtn{padding:7px 10px;font-size:11.5px}
  .wordmark span{display:none}
  .statusbadge{padding:6px 9px;letter-spacing:.04em}
  .hero h1{font-size:30px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;
    scroll-behavior:auto!important}
}
</style>

function inlineSvg(n,cls){
  return '<svg class="'+(cls||'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" '+
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[n]||ICONS.info)+'</svg>';
}
function ic(n,cls){
  return '<i data-lucide="'+(LUCIDE[n]||'circle')+'" data-fb="'+n+'" class="'+(cls||'')+'" aria-hidden="true"></i>';
}
/* Runs after every render: Lucide first, our own SVG for anything it does not know. */
function hydrateIcons(){
  try{ if(window.lucide&&window.lucide.createIcons) window.lucide.createIcons(); }catch(e){}
  document.querySelectorAll('i[data-lucide]').forEach(el=>{
    el.outerHTML=inlineSvg(el.getAttribute('data-fb')||'info',el.getAttribute('class')||'');
  });
}

const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
function t(k){return (STR[S.lang][k]!==undefined?STR[S.lang][k]:k);}
function lx(o){return typeof o==='string'?o:(o[S.lang]||o.he);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function money(ils,dec){
  if(S.lang==='he') return '₪'+(dec?ils.toFixed(2):Math.round(ils).toLocaleString('he-IL'));
  const usd=ils/FX;
  return '$'+(dec?usd.toFixed(2):Math.round(usd).toLocaleString('en-US'));
}
function km(a,b){
  const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function initials(name){
  const p=String(name).replace(/[^\p{L}\s]/gu,'').trim().split(/\s+/);
  return ((p[0]||'?')[0]+((p[1]||'')[0]||'')).toUpperCase();
}
function avatarCss(seed){const h=HUES[seed%HUES.length];
  return 'background:linear-gradient(140deg,hsl('+h+' 78% 68%),hsl('+((h+38)%360)+' 72% 55%))';}
function isPeak(){const h=new Date().getHours();return h>=17&&h<=22;}
function peakMult(){return isPeak()?1.15:1;}
function proDist(p){return km(S.loc,p);}
function proEta(p){
  const d=proDist(p);
  if(S.mode==='walkin') return Math.max(2,Math.round(d*12));   // walking minutes
  return Math.max(9,Math.round(12+d*5.5));                     // travel-to-you minutes
}
function ringPct(mins){return Math.max(6,Math.min(100,Math.round(100-(mins/60)*100)));}
function fmtTime(sec){const m=Math.floor(sec/60),s=sec%60;return m+':'+String(s).padStart(2,'0');}
function nowStr(){return new Date().toLocaleTimeString(STR[S.lang].locale,{hour:'2-digit',minute:'2-digit'});}
function catName(id){const c=CATS.find(c=>c.id===id);return c?t(c.k):id;}
function svcList(){
  const cat=S.cat||(S.pro?S.pro.cats[0]:'hair');
  return SERVICES[cat]||SERVICES.hair;
}
function pickedObjs(){
  const all=Object.values(SERVICES).flat();
  return S.picked.map(id=>all.find(s=>s.id===id)).filter(Boolean);
}
function addonObjs(){return S.addons.map(id=>ADDONS.find(a=>a.id===id)).filter(Boolean);}
function subtotal(){
  let n=pickedObjs().reduce((a,s)=>a+s.p,0)*peakMult();
  n+=addonObjs().reduce((a,s)=>a+s.p,0);
  return Math.round(n);
}
function tripFee(){
  if(S.mode==='walkin'||!S.pro) return 0;
  return Math.round(Math.min(89,29+proDist(S.pro)*11));
}
function shieldFee(){return 9;}
function serviceFee(){return Math.round(subtotal()*0.05);}
function discount(){return S.promoOk?Math.round((subtotal()+tripFee())*0.10):0;}
function grandTotal(){return Math.max(0,subtotal()+tripFee()+shieldFee()+serviceFee()+S.tip-discount());}
function duration(){return pickedObjs().reduce((a,s)=>a+s.d,0);}
function toast(msg,icon){
  S.toast={msg,icon:icon||'checkC'};render();
  clearTimeout(TICKERS.toast);TICKERS.toast=setTimeout(()=>{S.toast=null;render();},2600);
}
function go(screen){S.screen=screen;render();const sc=$('.scroll');if(sc)sc.scrollTop=0;}
function setLang(l){
  S.lang=l;
  document.documentElement.lang=l;
  document.documentElement.dir=STR[l].dir;
  render();
}

function visibleProviders(){
  let list=ALLPROV().filter(p=>p.modes.includes(S.mode));
  if(S.cat) list=list.filter(p=>p.cats.includes(S.cat));
  const q=(S.pquery||'').trim().toLowerCase();
  if(q) list=list.filter(p=>(p.he+' '+p.en+' '+lx(p.role)).toLowerCase().includes(q));
  if(S.filter==='instant') list=list.filter(p=>p.instant);
  if(S.filter==='top') list=list.filter(p=>p.rating>=4.8);
  if(S.filter==='live') list=list.filter(p=>p.live);
  if(S.filter==='verified') list=list.filter(p=>p.claim==='claimed');
  if(S.filter==='cheap') list.sort((a,b)=>minPrice(a)-minPrice(b));
  else if(S.filter==='close') list.sort((a,b)=>proDist(a)-proDist(b));
  else list.sort((a,b)=>proEta(a)-proEta(b));
  return list;
}

  const cats=S.cat?[S.cat]:p.cats;

/* ---------- 9. LIVE MAP (Leaflet + built-in fallback) ---------- */
let MAP=null,PROMARK=null,ROUTE=[],RI=0,LINE=null;
function makeRoute(from,to,n){
  const mid={lat:from.lat,lng:to.lng},pts=[];
  const seg=(a,b,c)=>{for(let i=0;i<c;i++){const k=i/c;
    pts.push({lat:a.lat+(b.lat-a.lat)*k+(Math.random()-.5)*0.0007,
              lng:a.lng+(b.lng-a.lng)*k+(Math.random()-.5)*0.0007});}};
  seg(from,mid,Math.floor(n/2));seg(mid,to,Math.ceil(n/2));pts.push({lat:to.lat,lng:to.lng});
  return pts;
}
function mountMap(){
  const el=document.getElementById('anmap');if(!el||!S.pro)return;
  const me={lat:S.loc.lat,lng:S.loc.lng};
  if(!ROUTE.length){ROUTE=makeRoute(S.pro,me,60);RI=0;}
  const cur=ROUTE[Math.min(RI,ROUTE.length-1)];
  if(window.L&&typeof window.L.map==='function'){
    if(MAP){try{MAP.remove();}catch(e){}MAP=null;}
    MAP=window.L.map(el,{zoomControl:false,attributionControl:true,scrollWheelZoom:false});
    window.L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
      {maxZoom:20,subdomains:'abcd',attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(MAP);
    LINE=window.L.polyline(ROUTE.slice(RI).map(p=>[p.lat,p.lng]),
      {color:'#FFC773',weight:3,opacity:.9,dashArray:'1 8',lineCap:'round'}).addTo(MAP);
    window.L.marker([me.lat,me.lng],{icon:window.L.divIcon({className:'pin-me',html:'<div class="mm"></div>',
      iconSize:[16,16],iconAnchor:[8,8]})}).addTo(MAP);
    PROMARK=window.L.marker([cur.lat,cur.lng],{icon:window.L.divIcon({className:'pin-pro',
      html:'<div class="pp" style="'+avatarCss(S.pro.seed)+'">'+esc(initials(lx(S.pro)))+'</div>',
      iconSize:[38,38],iconAnchor:[19,19]})}).addTo(MAP);
    try{MAP.fitBounds(window.L.latLngBounds([[me.lat,me.lng],[cur.lat,cur.lng]]),{padding:[55,55],maxZoom:15});}catch(e){}
    setTimeout(()=>{try{MAP.invalidateSize();}catch(e){}},120);
  }else{
    el.insertAdjacentHTML('afterend','<div class="fallmap" id="fallmap"><div class="fm-me"></div>'+
      '<div class="fm-pro" id="fmpro" style="'+avatarCss(S.pro.seed)+';left:20%;top:22%">'+esc(initials(lx(S.pro)))+'</div></div>');
  }
}
function moveMarker(){
  const cur=ROUTE[Math.min(RI,ROUTE.length-1)];
  if(MAP&&PROMARK){
    PROMARK.setLatLng([cur.lat,cur.lng]);
    if(LINE)LINE.setLatLngs(ROUTE.slice(RI).map(p=>[p.lat,p.lng]));
  }else{
    const fm=document.getElementById('fmpro');
    if(fm){const k=RI/(ROUTE.length-1);fm.style.left=(20+k*30)+'%';fm.style.top=(22+k*40)+'%';}
  }
}

function onInput(e){

  if(k==='__gkey'){CFG.googleKey=el.value;return;}     // credentials live in memory only
  if(k==='__apify'){CFG.apifyToken=el.value;return;}
  if(k==='__actor'){CFG.apifyActor=el.value;return;}
  if(k==='__obhandle'){OB.handle=el.value.replace(/^@/,'');return;}
  if(k==='__obname'){OB.name=el.value;return;}
  if(k==='__cnum'){const d=el.value.replace(/\D/g,'').slice(0,19);S.card.num=d;el.value=fmtCard(d);paintPayState();return;}
  if(k==='__cexp'){let d=el.value.replace(/\D/g,'').slice(0,4);
    S.card.exp=d.length>2?d.slice(0,2)+'/'+d.slice(2):d;el.value=S.card.exp;paintPayState();return;}
  if(k==='__ccvc'){S.card.cvc=el.value.replace(/\D/g,'').slice(0,4);el.value=S.card.cvc;paintPayState();return;}
  if(k==='__cname'){S.card.name=el.value;paintPayState();return;}
  if(k==='query'){S.query=el.value;acSchedule(el.value);return;}
  if(k==='pquery'){S.pquery=el.value;render();return;}
  if(k==='__api'){CFG.apiBase=el.value;return;}
  S[k]=el.value;
}

const CFG={googleKey:'',apifyToken:'',apifyActor:'apify~instagram-profile-scraper',apiBase:'',acSession:'',

function fetchJson(url,opts,ms){
  const c=('AbortController' in window)?new AbortController():null;
  const id=setTimeout(()=>{if(c)c.abort();},ms||CFG.timeout);
  return fetch(url,Object.assign({signal:c?c.signal:undefined},opts||{}))
    .then(r=>{clearTimeout(id);if(!r.ok)return r.text().then(tx=>{throw new Error('HTTP '+r.status+' '+tx.slice(0,90));});return r.json();})
    .catch(e=>{clearTimeout(id);throw e;});
}
const G2CAT={hair_salon:'hair',hair_care:'hair',barber_shop:'barber',beauty_salon:'makeup',
             nail_salon:'nails',spa:'massage',massage:'massage',wellness_center:'massage'};
const O2CAT={hairdresser:'hair',barber:'barber',beauty:'makeup',nails:'nails',massage:'massage',cosmetics:'makeup'};
function catsFromGoogle(types){
  const out=[];(types||[]).forEach(x=>{if(G2CAT[x]&&!out.includes(G2CAT[x]))out.push(G2CAT[x]);});
  return out.length?out:['hair'];
}
function catsFromOsm(tg){
  const out=[];
  if(tg.shop&&O2CAT[tg.shop])out.push(O2CAT[tg.shop]);
  if(tg.amenity==='spa'||tg.leisure==='spa')out.push('massage');
  if(tg['beauty'])['nails','massage','makeup'].forEach(c=>{if(String(tg.beauty).includes(c.slice(0,4))&&!out.includes(c))out.push(c);});
  return out.length?out:['hair'];
}
async function fetchGoogle(lat,lng){

  const res=await fetchJson('https://places.googleapis.com/v1/places:searchNearby',{
    method:'POST',
    headers:{'Content-Type':'application/json','X-Goog-Api-Key':CFG.googleKey.trim(),
      'X-Goog-FieldMask':'places.id,places.displayName,places.formattedAddress,places.location,places.rating,places.userRatingCount,places.types,places.primaryType,places.currentOpeningHours.openNow'},
    body:JSON.stringify(body)});
  return (res.places||[]).map((pl,i)=>{

    return {id:'g_'+(pl.id||i),he:nm,en:nm,

async function fetchGoogleReviews(placeId){

    '?languageCode='+(S.lang==='he'?'he':'en'),

async function fetchOverpass(lat,lng){
  const r=Math.max(400,Math.min(6000,CFG.radius));
  const q='[out:json][timeout:20];('+
    'node["shop"~"^(hairdresser|beauty|nails|massage)$"](around:'+r+','+lat+','+lng+');'+
    'way["shop"~"^(hairdresser|beauty|nails|massage)$"](around:'+r+','+lat+','+lng+');'+
    'node["amenity"="spa"](around:'+r+','+lat+','+lng+');'+

async function loadPlaces(){
  if(S.places.state==='loading')return;
  S.places={state:'loading',source:'',count:0,ts:null,err:''};render();
  const lat=S.loc.lat,lng=S.loc.lng;
  let out=[],source='',err='';
  // 1) our own serverless function (production path — the key stays on the server)
  try{
    out=await pullBackend(lat,lng);
    if(out.length)source=S.backend.state==='fallback'?'backend_fallback':'backend';
  }catch(e){
    S.backend={state:'offline',source:'',count:0,ts:nowStr(),err:String((e&&e.message)||e)};
    logReq('warn','backend unreachable: '+String((e&&e.message)||e));
  }
  // 2) direct browser key (local demo only) 3) Overpass 4) seeded dataset
  if(!out.length&&CFG.useGoogle&&CFG.googleKey.trim()){
    try{logReq('','POST places.googleapis.com/v1/places:searchNearby radius='+CFG.radius);
      out=await fetchGoogle(lat,lng);source='google';logReq('ok','200 · '+out.length+' places');
    }catch(e){err=e.message;logReq('err','Google: '+e.message);}
  }
  if(!out.length&&CFG.useOsm){
    try{logReq('','POST overpass-api.de/api/interpreter radius='+CFG.radius);
      out=await fetchOverpass(lat,lng);source='osm';logReq('ok','200 · '+out.length+' elements');
    }catch(e){err=err||e.message;logReq('err','Overpass: '+e.message);}
  }
  DYN=out;
  S.places={count:out.length,ts:nowStr(),source:source,err:err,
    state: out.length?'ok' : (err?'blocked' : (CFG.googleKey.trim()?'empty':'nokey'))};
  render();

function scrapPushFrom(src){
  SCRAP.feed.unshift({id:++SCRAP.uid,h:src.h,n:src.n,p:src.p,f:src.f+Math.floor(Math.random()*900),
    cat:src.cat,pub:src.pub!==false,state:'queued',prog:0,cd:30,seed:SCRAP.uid%12,
    dist:(0.4+Math.random()*3.2)});
  if(SCRAP.feed.length>7)SCRAP.feed.pop();
}
function scrapPush(){
  const src=POOL[SCRAP.next%POOL.length];SCRAP.next++;
  if(SPAM.blacklist.indexOf(src.h)>-1){         // opted out: never contacted again
    for(let i=0;i<POOL.length;i++){              // walk to the next non-blacklisted profile
      const alt=POOL[(SCRAP.next+i)%POOL.length];
      if(SPAM.blacklist.indexOf(alt.h)<0){SCRAP.next+=i+1;return scrapPushFrom(alt);}
    }
    return scrapPushFrom(synthProfile());        // whole pool opted out: keep discovering new ones
  }
  SCRAP.feed.unshift({id:++SCRAP.uid,h:src.h,n:src.n,p:src.p,f:src.f+Math.floor(Math.random()*900),
    cat:src.cat,pub:src.pub!==false,state:'queued',prog:0,cd:30,seed:SCRAP.uid%12,
    dist:(0.4+Math.random()*3.2)});
  if(SCRAP.feed.length>7)SCRAP.feed.pop();
}

function scrapTick(){
  if(!SCRAP.on)return;
  SPAM.nextIn=Math.max(0,SPAM.nextIn-SPAM.demoX);         // demo runs the throttle at x10
  if(SCRAP.feed.filter(c=>c.state==='queued'||c.state==='scanning').length<2)scrapPush();
  SCRAP.feed.forEach(c=>{
    if(c.state==='queued'){c.state='scanning';c.prog=8;SCRAP.scanned++;}
    else if(c.state==='scanning'){
      c.prog=Math.min(100,c.prog+28+Math.random()*22);
      if(c.prog>=100){c.state='matched';SCRAP.matched++;}
    }
    else if(c.state==='matched'){
      if(!c.pub){c.state='nopub';return;}                 // 30A(c)(1): public B2B contacts only
      if(SPAM.nextIn>0)return;                            // 20-50s throttle between sends
      c.state='outreach';c.cd=30;SCRAP.out++;SPAM.sent++;
      SPAM.nextIn=throttleWait();S.scrapedToday++;
    }
    else if(c.state==='outreach'){
      c.cd--;
      if(Math.random()<0.02){                             // replied STOP
        c.state='optout';SPAM.optout++;SPAM.blocked++;
        if(SPAM.blacklist.indexOf(c.h)<0)SPAM.blacklist.push(c.h);
        return;
      }
      if(Math.random()<0.10)scrapClaim(c.id,true);
      else if(c.cd<=0){c.state='expired';}
    }
  });
  if(S.screen==='scraper')render();
  else if(S.screen==='home'||S.screen==='providers')paintEngines();
}

/* ============================================================================
   15. GOOGLE PLACES AUTOCOMPLETE
   Places API (New) :autocomplete when a key is present, Nominatim search as the
   keyless fallback. Debounced, so Nominatim's 1 req/sec policy is respected.
   ========================================================================== */
const AC={items:[],state:'idle',open:false,timer:null};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function acSession(){
  if(!CFG.acSession)CFG.acSession='ani-'+Math.random().toString(36).slice(2)+Date.now().toString(36);
  return CFG.acSession;
}
function acSchedule(q){
  clearTimeout(AC.timer);
  if(q.trim().length<2){AC.items=[];AC.open=false;AC.state='idle';return;}
  AC.timer=setTimeout(()=>acSearch(q),450);
}
async function acSearch(q){
  AC.state='loading';AC.open=true;render();
  let items=[];
  if(CFG.useGoogle&&CFG.googleKey.trim()){
    try{
      logReq('','POST places.googleapis.com/v1/places:autocomplete "'+q.slice(0,24)+'"');
      const res=await fetchJson('https://places.googleapis.com/v1/places:autocomplete',{
        method:'POST',headers:{'Content-Type':'application/json','X-Goog-Api-Key':CFG.googleKey.trim()},
        body:JSON.stringify({input:q,languageCode:S.lang==='he'?'he':'en',sessionToken:acSession(),
          locationBias:{circle:{center:{latitude:S.loc.lat,longitude:S.loc.lng},radius:30000}}})});
      items=(res.suggestions||[]).filter(s=>s.placePrediction).map(s=>{
        const pp=s.placePrediction,sf=pp.structuredFormat||{};
        return {id:pp.placeId,main:(sf.mainText&&sf.mainText.text)||(pp.text&&pp.text.text)||'',
                sub:(sf.secondaryText&&sf.secondaryText.text)||'',src:'google'};
      }).filter(x=>x.main);
      logReq('ok','200 · '+items.length+' predictions');
    }catch(e){logReq('err','Autocomplete: '+e.message);}
  }
  if(!items.length){
    try{
      logReq('','GET nominatim.openstreetmap.org/search "'+q.slice(0,24)+'"');
      const res=await fetchJson('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language='+
        (S.lang==='he'?'he':'en')+'&q='+encodeURIComponent(q),{},8000);
      items=(res||[]).map(r=>({id:'osm:'+r.lat+','+r.lon,
        main:r.name||String(r.display_name||'').split(',')[0],
        sub:String(r.display_name||''),lat:+r.lat,lng:+r.lon,src:'osm'})).filter(x=>x.main);
      logReq('ok','200 · '+items.length+' results');
    }catch(e){logReq('err','Nominatim: '+e.message);}
  }
  AC.items=items;AC.state='ok';AC.open=true;render();
}
async function acPick(id){
  const it=AC.items.find(x=>x.id===id);
  AC.open=false;
  if(!it){render();return;}
  S.query=it.main;CFG.acSession='';   // session closes on selection
  if(it.lat!=null&&it.lng!=null){
    S.loc={he:it.main,en:it.main,lat:it.lat,lng:it.lng};S.gps=true;render();
    toast(it.main,'pin');loadPlaces();return;
  }
  try{
    logReq('','GET places.googleapis.com/v1/places/'+String(it.id).slice(0,12)+'…');
    const d=await fetchJson('https://places.googleapis.com/v1/places/'+encodeURIComponent(it.id)+
      '?languageCode='+(S.lang==='he'?'he':'en'),
      {headers:{'X-Goog-Api-Key':CFG.googleKey.trim(),'X-Goog-FieldMask':'location,formattedAddress,displayName'}});
    S.loc={he:it.main,en:it.main,lat:d.location.latitude,lng:d.location.longitude};S.gps=true;
    logReq('ok','200 · '+d.location.latitude.toFixed(4)+','+d.location.longitude.toFixed(4));
    render();toast(it.main,'pin');loadPlaces();
  }catch(e){logReq('err','Place details: '+e.message);render();}
}

  const out=[],base=(CATS.find(c=>c.id===cat)||CATS[0]).ic;

  return out;
}
function galOf(p){

const OB={step:0,platform:'ig',handle:'',phone:'',consent:false,running:false,speed:1,

const BIOS={
 nails:{he:'מעצבת ציפורניים · בנייה בג׳ל ואמנות נייל · מגיעה עד הבית ולמלונות בת״א',en:'Nail artist · builder gel and nail art · mobile across Tel Aviv hotels'},
 hair:{he:'מעצבת שיער · פן, צבע ותסרוקות ערב · ניידת בגוש דן',en:'Hair stylist · blowouts, colour and evening updos · mobile in Gush Dan'},
 makeup:{he:'מאפרת · איפור ערב, כלות ואירועים · מגיעה לחדר',en:'Makeup artist · evening, bridal and events · comes to your room'},
 massage:{he:'מעסה מוסמכת · שוודי, רקמות עמוק והריון · ציוד מלא בהגעה',en:'Certified therapist · Swedish, deep tissue and prenatal · full kit on arrival'},
 barber:{he:'ברבר · פייד, זקן וגילוח מגבת חמה · ניידת',en:'Barber · fades, beards and hot towel shaves · mobile'},
 lashes:{he:'ריסים וגבות · הרחבות, הרמה ולמינציה · ניידת',en:'Lashes and brows · extensions, lifts and lamination · mobile'},
};
function obStage(){
  let k='obStConnect';
  OBSTAGES.forEach(s=>{if(OB.t>=s[0])k=s[1];});
  return k;
}
function obReset(pre){
  Object.assign(OB,{step:0,platform:(pre&&pre.platform)||'ig',handle:(pre&&pre.handle)||'',phone:'',
    consent:false,otpOk:false,running:false,t:0,lastSec:-1,pic:null,bio:'',photos:[],got:0,syncing:false,liveId:null,
    name:(pre&&pre.name)||'',cat:(pre&&pre.cat)||'nails',price:160,src:'sim'});
}
function obStart(){
  OB.running=true;OB.step=2;OB.t=0;OB.lastSec=-1;OB.photos=genGallery(Date.now()%12,OB.cat,12).map(x=>({...x,url:null}));
  OB.got=0;OB.pic={h:HUES[(OB.handle.length*3)%HUES.length]};
  OB.src=CFG.apifyToken&&CFG.apifyToken.trim()?'apify':'sim';
  if(OB.src==='apify'){
    OB.syncing=true;
    apifyIngest(OB.handle||OB.phone).then(r=>{
      OB.syncing=false;
      if(!r)return;
      if(r.pic)OB.pic={url:r.pic};
      if(r.bio)OB.bio=r.bio;
      if(r.name&&!OB.name)OB.name=r.name;
      if(r.photos&&r.photos.length)r.photos.forEach((ph,i)=>{if(OB.photos[i])OB.photos[i]={url:ph.url};});
      logReq('ok','Apify mapped · '+((r.photos||[]).length)+' photos');
      backfillLive();   // a card that already went live gets the real gallery
      render();
    }).catch(e=>{OB.syncing=false;OB.src='sim';logReq('err','Apify: '+e.message);render();});
  }
  render();
}
function obTick(){
  if(!OB.running)return;
  OB.t=Math.min(OB.total,OB.t+0.25*OB.speed);
  OB.got=Math.max(0,Math.min(12,Math.floor((OB.t-8)/1.5)));
  if(OB.t>=5&&!OB.bio)OB.bio=lx(BIOS[OB.cat]||BIOS.nails);
  const r=document.querySelector('.ingring');
  if(r)r.style.setProperty('--p',Math.round(OB.t/OB.total*100));
  if(OB.t>=OB.total){
    OB.running=false;OB.step=3;
    if(!OB.name)OB.name=(OB.handle||'ANI Pro').replace(/[._]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
    OB.price=(SERVICES[OB.cat]||SERVICES.hair)[0].p;
    render();return;
  }
  if(Math.floor(OB.t)!==OB.lastSec){OB.lastSec=Math.floor(OB.t);render();}

async function apifyIngest(handle){
  const tok=CFG.apifyToken.trim(),actor=(CFG.apifyActor||'apify~instagram-profile-scraper').trim();
  logReq('','POST api.apify.com/v2/acts/'+actor+'/runs');
  const start=await fetchJson('https://api.apify.com/v2/acts/'+encodeURIComponent(actor)+'/runs?token='+encodeURIComponent(tok),
    {method:'POST',headers:{'Content-Type':'application/json'},
     body:JSON.stringify({usernames:[String(handle).replace(/^@/,'')],resultsLimit:12,resultsType:'details'})},20000);
  const run=start.data||{};
  logReq('ok','run '+run.id+' · '+run.status);
  let st=run;
  for(let i=0;i<20;i++){
    await sleep(1500);
    const r=await fetchJson('https://api.apify.com/v2/actor-runs/'+run.id+'?token='+encodeURIComponent(tok),{},12000);
    st=r.data||{};
    if(st.status==='SUCCEEDED')break;
    if(['FAILED','ABORTED','TIMED-OUT'].indexOf(st.status)>-1)throw new Error('run '+st.status);
  }
  const ds=st.defaultDatasetId||run.defaultDatasetId;
  const items=await fetchJson('https://api.apify.com/v2/datasets/'+ds+'/items?clean=true&format=json&token='+encodeURIComponent(tok),{},20000);
  logReq('ok','dataset '+ds+' · '+(items||[]).length+' items');
  return mapApify(items);
}
function mapApify(items){
  const arr=Array.isArray(items)?items:[];const a=arr[0]||{};
  const posts=a.latestPosts||a.posts||a.media||(arr.length>1?arr:[]);
  const photos=[];
  (Array.isArray(posts)?posts:[]).forEach(x=>{
    const u=x.displayUrl||x.imageUrl||x.thumbnailUrl||x.image||x.url||x.src;
    if(u&&photos.length<12&&/^https?:\/\//.test(u))photos.push({url:u});
  });
  return {pic:a.profilePicUrlHD||a.profilePicUrl||a.avatar||null,
          bio:a.biography||a.bio||a.description||'',
          name:a.fullName||a.name||a.username||'',photos:photos};
}

/* ============================================================================
   18. CARD PAYMENT — Luhn, expiry, CVC, brand detection, Apple Pay probe
   ========================================================================== */
S.card={num:'',exp:'',cvc:'',name:'',touched:false};
function luhn(d){
  if(!/^\d{12,19}$/.test(d))return false;
  let s=0,alt=false;
  for(let i=d.length-1;i>=0;i--){let n=+d[i];if(alt){n*=2;if(n>9)n-=9;}s+=n;alt=!alt;}
  return s%10===0;
}
function brandOf(d){
  if(/^4/.test(d))return'VISA';
  if(/^(5[1-5]|2[2-7])/.test(d))return'MASTERCARD';
  if(/^3[47]/.test(d))return'AMEX';
  if(/^(62|81)/.test(d))return'UNIONPAY';
  if(/^3(0|6|8)/.test(d))return'DINERS';
  return'';
}
function expOk(v){
  const m=String(v).match(/^(\d{2})\s*\/?\s*(\d{2})$/);
  if(!m)return false;
  const mm=+m[1],yy=2000+ +m[2];
  if(mm<1||mm>12)return false;
  return new Date(yy,mm,1)>new Date();
}
function cvcOk(v){return brandOf(S.card.num)==='AMEX'?/^\d{4}$/.test(v):/^\d{3,4}$/.test(v);}
function cardOk(){return luhn(S.card.num)&&expOk(S.card.exp)&&cvcOk(S.card.cvc)&&S.card.name.trim().length>1;}
function applePayOk(){
  try{return !!(window.ApplePaySession&&window.ApplePaySession.canMakePayments&&window.ApplePaySession.canMakePayments());}
  catch(e){return false;}
}
function fmtCard(d){return brandOf(d)==='AMEX'
  ? d.replace(/^(\d{4})(\d{0,6})(\d{0,5}).*/,(m,a,b,c)=>[a,b,c].filter(Boolean).join(' '))
  : d.replace(/(.{4})/g,'$1 ').trim();}
function cardForm(){
  const d=S.card,br=brandOf(d.num),show=d.touched;
  const bad={num:show&&!luhn(d.num),exp:show&&!expOk(d.exp),cvc:show&&!cvcOk(d.cvc)};
  return '<div class="cardbox">'+
    '<div class="cfield '+(bad.num?'bad':'')+'">'+ic('card')+
      '<input type="text" inputmode="numeric" autocomplete="cc-number" data-k="__cnum" value="'+esc(fmtCard(d.num))+
      '" placeholder="4242 4242 4242 4242" aria-label="'+esc(t('cardNum'))+'">'+
      (br?'<span class="brand">'+br+'</span>':'')+'</div>'+
    (bad.num?'<div class="cerr">'+ic('alert')+esc(t('cardBad'))+'</div>':'')+

      '<div class="cfield '+(bad.exp?'bad':'')+'">'+ic('clock')+

        '" placeholder="MM/YY" aria-label="'+esc(t('cardExp'))+'"></div>'+

        '<input type="text" inputmode="numeric" autocomplete="cc-csc" data-k="__ccvc" value="'+esc(d.cvc)+
        '" placeholder="CVC" aria-label="'+esc(t('cardCvc'))+'"></div>'+
    '</div>'+
    ((bad.exp||bad.cvc)?'<div class="cerr">'+ic('alert')+esc(bad.exp?t('expBad'):t('cvcBad'))+'</div>':'')+
    '<div class="cfield" style="margin-top:8px">'+ic('users')+
